services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HANGMAN_VOCABULARY: /app/data/processed/wordfreq_vocabulary.parquet
      HANGMAN_MODELS_DIR: /app/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"
